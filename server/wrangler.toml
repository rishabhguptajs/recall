name = "recall-license"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Dodo Payments license API. Use https://test.dodopayments.com while testing with test-mode keys.
# Live. For testing, use `wrangler dev` with DODO_API_BASE=https://test.dodopayments.com and the test
# product ID in server/.dev.vars. Never deploy test mode: test purchases are free, so test keys would unlock Pro.
DODO_API_BASE = "https://live.dodopayments.com"
# Product ID(s) of Recall Pro in your Dodo dashboard (pdt_…), comma-separated. Required: keys
# for any other product, including other merchants' products, are refused.
DODO_PRODUCT_IDS = "pdt_0NqInUfKFr2xPXRo0axLw"
# Optional extra check: your Dodo business ID.
# Left empty until the live business ID is confirmed (the product ID check above already binds keys to Recall).
DODO_BUSINESS_ID = ""

[[d1_databases]]
binding = "DB"
database_name = "recall-license"
database_id = "e65eb386-14e7-4ab3-8ad2-506da751e2ed"
migrations_dir = "migrations"

# DMGs and appcast.xml, served by /download/… and /appcast.xml (upload with scripts/publish-release.sh).
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "recall-releases"

# Secret (never in this file):
#   wrangler secret put SIGNING_KEY   # base64 PKCS#8 Ed25519 private key, see server/README.md
# For local `wrangler dev`, put SIGNING_KEY (and optionally DODO_API_BASE) in server/.dev.vars (git-ignored).
