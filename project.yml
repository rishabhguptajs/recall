name: Recall
options:
  bundleIdPrefix: dev.recall
  deploymentTarget:
    macOS: "14.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.4.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  Recall:
    type: application
    platform: macOS
    sources: [App, UI, Indexing, Search, Storage, Embedding, Licensing]
    dependencies:
      - package: GRDB
      - package: KeyboardShortcuts
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Recall
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "14.0"
        NSDesktopFolderUsageDescription: Recall indexes files on your Desktop so you can search them. Nothing leaves your Mac.
        NSDocumentsFolderUsageDescription: Recall indexes your Documents so you can search them. Nothing leaves your Mac.
        NSDownloadsFolderUsageDescription: Recall indexes your Downloads so you can search them. Nothing leaves your Mac.
        RecallLicenseServer: $(RECALL_LICENSE_SERVER)
        # Updates (Sparkle). Automatic checks are off until the user turns them on.
        SUFeedURL: https://raegent.com/recall/appcast.xml
        SUPublicEDKey: 6XNRQTh0MjQgbSYjw0omE8xoXcJWGKXqK2MhHtH/4dc=
        SUEnableAutomaticChecks: false
        SUEnableSystemProfiling: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.recall.Recall
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      configs:
        # Debug talks to `wrangler dev` on this Mac; Release to the deployed Worker.
        Debug:
          RECALL_LICENSE_SERVER: http://127.0.0.1:8787
        Release:
          RECALL_LICENSE_SERVER: https://recall-license.rishabhgupta4523.workers.dev
