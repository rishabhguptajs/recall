name: Recall
options:
  bundleIdPrefix: dev.recall
  deploymentTarget:
    macOS: "14.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.4.0
targets:
  Recall:
    type: application
    platform: macOS
    sources: [App, UI, Indexing, Search, Storage, Embedding]
    dependencies:
      - package: GRDB
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Recall
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSDesktopFolderUsageDescription: Recall indexes files on your Desktop so you can search them. Nothing leaves your Mac.
        NSDocumentsFolderUsageDescription: Recall indexes your Documents so you can search them. Nothing leaves your Mac.
        NSDownloadsFolderUsageDescription: Recall indexes your Downloads so you can search them. Nothing leaves your Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.recall.Recall
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
